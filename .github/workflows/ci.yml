name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Basic, quick pipeline: one job on the project's default Python (3.11), build
# the conda environment, then byte-compile and run the unittest suite.
jobs:
  test:
    name: Quick test (py3.11)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: owcheminf
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          use-mamba: true

      - name: Install package
        # Conda already provides every runtime dependency, so install only the
        # project itself with --no-deps (pip must not pull PyPI wheels over the
        # conda-forge binaries). pytest is installed separately so it can bring
        # its own small pure-Python deps.
        run: |
          pip install -e . --no-deps
          pip install pytest

      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest tests -q
